<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工具箱·索引</title>
<meta name="referrer" content="same-origin" />
<style>
/* ---------- 主题变量 ---------- */
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --card-hover: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --subtle: #94a3b8;
  --border: #e6e9ee;
  --border-strong: #d1d7e0;
  --accent: #2563eb;
  --accent-soft: #e0edff;
  --accent-soft-text: #1d4ed8;
  --sidebar-bg: #ffffff;
  --topbar-bg: rgba(246,247,249,.82);
  --chip-bg: #f1f5f9;
  --chip-text: #475569;
  --input-bg: #ffffff;
  --input-border: #e2e8f0;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
  --shadow-lg: 0 14px 36px rgba(15,23,42,.10);
  --kbd-bg: #f1f5f9;
  --kbd-border: #e2e8f0;
  --frame-bg: #ffffff;
}

[data-theme="dark"] {
  --bg: #0a0e14;
  --card: #141a24;
  --card-hover: #182029;
  --text: #e6edf5;
  --muted: #8b98a8;
  --subtle: #64748b;
  --border: #1f2937;
  --border-strong: #2d3a4a;
  --accent: #3b82f6;
  --accent-soft: rgba(59,130,246,.15);
  --accent-soft-text: #93c5fd;
  --sidebar-bg: #0e141d;
  --topbar-bg: rgba(10,14,20,.82);
  --chip-bg: #1a2332;
  --chip-text: #b6c2d1;
  --input-bg: #141a24;
  --input-border: #263243;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-lg: 0 14px 36px rgba(0,0,0,.55);
  --kbd-bg: #1a2332;
  --kbd-border: #2d3a4a;
  --frame-bg: #ffffff;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ========================================================
 * 视图切换
 * ======================================================== */
.view { display: none; }
.view.active { display: block; }

/* ========================================================
 * 首页
 * ======================================================== */
.home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.home-header {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  transition: background-color .25s ease, border-color .25s ease;
}

.home-brand { display: flex; align-items: center; gap: 12px; }

.brand-logo {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
  display: grid; place-items: center;
  font-size: 18px;
  box-shadow: 0 3px 10px rgba(37,99,235,.28);
  flex-shrink: 0;
}

.brand-text { line-height: 1.2; }
.brand-name { font-weight: 700; font-size: 14.5px; letter-spacing: .2px; }
.brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

.home-main {
  flex: 1;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

.home-hero { text-align: center; margin-bottom: 30px; }
.home-hero h1 {
  margin: 0 0 8px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.5px;
}
.home-hero p { margin: 0; color: var(--muted); font-size: 14px; }

.home-search {
  max-width: 560px;
  margin: 0 auto 20px;
  position: relative;
}

.home-search .search-input {
  width: 100%;
  padding: 11px 50px 11px 38px;
  border: 1px solid var(--input-border);
  border-radius: 12px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s, background-color .25s;
  box-shadow: var(--shadow-sm);
}

.home-search .search-input::placeholder { color: var(--subtle); }

.home-search .search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(37,99,235,.14);
}

.home-search .search-icon {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--subtle);
  pointer-events: none;
}

.home-search .search-kbd {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 11px; padding: 2px 7px;
  border-radius: 5px;
  background: var(--kbd-bg);
  border: 1px solid var(--kbd-border);
  color: var(--muted);
  font-family: ui-monospace, monospace;
  pointer-events: none;
}

.filters {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center;
  margin-bottom: 26px;
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-size: 12.5px;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex; align-items: center; gap: 6px;
  user-select: none; font-weight: 500;
}

.filter-chip:hover {
  border-color: var(--border-strong);
  color: var(--text);
  background: var(--chip-bg);
}

.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,.32);
}

.filter-chip .cnt { font-size: 11px; opacity: .72; font-variant-numeric: tabular-nums; }

/* ---------- 卡片列表：ul / li ---------- */
.grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s cubic-bezier(.2,.8,.3,1),
              box-shadow .18s, border-color .18s, background-color .25s;
  overflow: hidden;
  animation: cardIn .32s ease both;
  color: var(--text);
  text-align: left;
  list-style: none;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.card::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: 14px;
  padding: 1px;
  background: linear-gradient(135deg, var(--accent), transparent 55%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: transparent;
  background: var(--card-hover);
}

.card:hover::before { opacity: 1; }

.card-icon {
  width: 46px; height: 46px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: 22px;
  flex-shrink: 0;
  transition: transform .2s;
}

.card:hover .card-icon { transform: scale(1.05) rotate(-3deg); }

.card-icon[data-tint="blue"]    { background: #e0edff; }
.card-icon[data-tint="emerald"] { background: #d6f5e6; }
.card-icon[data-tint="violet"]  { background: #ebe3fd; }
.card-icon[data-tint="amber"]   { background: #fdf0d3; }
.card-icon[data-tint="rose"]    { background: #fee2e6; }
.card-icon[data-tint="cyan"]    { background: #d6f1f7; }

[data-theme="dark"] .card-icon[data-tint="blue"]    { background: rgba(59,130,246,.16); }
[data-theme="dark"] .card-icon[data-tint="emerald"] { background: rgba(16,185,129,.16); }
[data-theme="dark"] .card-icon[data-tint="violet"]  { background: rgba(139,92,246,.18); }
[data-theme="dark"] .card-icon[data-tint="amber"]   { background: rgba(245,158,11,.16); }
[data-theme="dark"] .card-icon[data-tint="rose"]    { background: rgba(244,63,94,.16); }
[data-theme="dark"] .card-icon[data-tint="cyan"]    { background: rgba(6,182,212,.16); }

.card-title {
  font-size: 15px; font-weight: 700;
  color: var(--text); letter-spacing: -.1px;
  margin-bottom: 5px;
}

.card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}

.card-tags { display: flex; gap: 6px; flex-wrap: wrap; overflow: hidden; }

.mini-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--chip-bg);
  color: var(--chip-text);
  white-space: nowrap;
  font-weight: 500;
}

.card-open {
  font-size: 12.5px;
  color: var(--accent);
  font-weight: 600;
  display: inline-flex; align-items: center; gap: 3px;
  white-space: nowrap;
  transition: gap .18s;
}

.card:hover .card-open { gap: 7px; }
.card-open svg { width: 13px; height: 13px; }

.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty-icon { font-size: 42px; margin-bottom: 12px; opacity: .6; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
.empty-sub { font-size: 13px; }

.home-footer {
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--subtle);
}

/* ========================================================
 * 工作区
 * ======================================================== */
.workspace {
  display: grid;
  grid-template-columns: 264px 1fr;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background-color .25s ease, border-color .25s ease, transform .25s ease;
}

.sidebar-head {
  padding: 12px 12px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.back-btn {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  justify-content: center;
}

.back-btn:hover {
  background: var(--chip-bg);
  color: var(--text);
  border-color: var(--border-strong);
}

.back-btn svg { width: 15px; height: 15px; }

.sidebar-search {
  padding: 4px 12px 10px;
  flex-shrink: 0;
  position: relative;
}

.sidebar-search .search-input {
  width: 100%;
  padding: 7px 10px 7px 30px;
  border: 1px solid var(--input-border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 12.5px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}

.sidebar-search .search-input::placeholder { color: var(--subtle); }
.sidebar-search .search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

.sidebar-search .search-icon {
  position: absolute; left: 20px; top: 50%;
  transform: translateY(-50%);
  margin-top: -5px;
  width: 14px; height: 14px;
  color: var(--subtle);
  pointer-events: none;
}

/* ---------- 侧边栏导航：ul / li ---------- */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 2px 10px 12px;
  list-style: none;
  margin: 0;
}

.sidebar-nav::-webkit-scrollbar { width: 6px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.nav-group { margin-bottom: 2px; }

.group-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px 6px;
  font-size: 11px;
  color: var(--subtle);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  user-select: none;
  list-style: none;
}

.group-title .cnt {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 8px;
  background: var(--chip-bg);
  color: var(--chip-text);
  font-weight: 500;
  letter-spacing: 0;
}

.nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  transition: background-color .15s, color .15s;
  user-select: none;
  margin-bottom: 1px;
  list-style: none;
}

.nav-item:hover { background: var(--chip-bg); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent-soft-text);
  font-weight: 600;
}

.nav-item .nav-icon {
  width: 22px; height: 22px;
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 12px;
  flex-shrink: 0;
}

.nav-item[data-tint="blue"] .nav-icon    { background: #e0edff; }
.nav-item[data-tint="emerald"] .nav-icon { background: #d6f5e6; }
.nav-item[data-tint="violet"] .nav-icon  { background: #ebe3fd; }
.nav-item[data-tint="amber"] .nav-icon   { background: #fdf0d3; }
.nav-item[data-tint="rose"] .nav-icon    { background: #fee2e6; }
.nav-item[data-tint="cyan"] .nav-icon    { background: #d6f1f7; }

[data-theme="dark"] .nav-item[data-tint="blue"] .nav-icon    { background: rgba(59,130,246,.18); }
[data-theme="dark"] .nav-item[data-tint="emerald"] .nav-icon { background: rgba(16,185,129,.18); }
[data-theme="dark"] .nav-item[data-tint="violet"] .nav-icon  { background: rgba(139,92,246,.2); }
[data-theme="dark"] .nav-item[data-tint="amber"] .nav-icon   { background: rgba(245,158,11,.18); }
[data-theme="dark"] .nav-item[data-tint="rose"] .nav-icon    { background: rgba(244,63,94,.18); }
[data-theme="dark"] .nav-item[data-tint="cyan"] .nav-icon    { background: rgba(6,182,212,.18); }

.nav-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-foot {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}

.sidebar-foot .ver { font-size: 11.5px; color: var(--subtle); }

.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.main-head {
  height: 52px;
  flex-shrink: 0;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--topbar-bg);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: background-color .25s ease, border-color .25s ease;
}

.menu-toggle {
  display: none;
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  place-items: center;
  flex-shrink: 0;
}

.menu-toggle svg { width: 17px; height: 17px; }

.main-title {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.main-actions { display: flex; gap: 6px; flex-shrink: 0; }

.action-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  display: grid; place-items: center;
  transition: all .15s;
}

.action-btn:hover { background: var(--chip-bg); color: var(--text); border-color: var(--border-strong); }
.action-btn svg { width: 15px; height: 15px; }
.action-btn:disabled { opacity: .4; cursor: not-allowed; }

.main-body {
  flex: 1;
  position: relative;
  background: var(--bg);
  overflow: hidden;
  min-height: 0;
}

.main-body iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: var(--frame-bg);
}

.loading-mask {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--muted);
  font-size: 13px;
  z-index: 5;
  transition: opacity .25s;
}

.loading-mask.hide { opacity: 0; pointer-events: none; }

.spinner {
  width: 26px; height: 26px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 10px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.error-box { max-width: 460px; padding: 0 20px; text-align: center; }
.error-box .icon { font-size: 34px; margin-bottom: 10px; }
.error-box .title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.error-box .desc { font-size: 13px; color: var(--muted); line-height: 1.7; }
.error-box code {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--chip-bg);
  color: var(--chip-text);
  font-family: ui-monospace, monospace;
  font-size: 12px;
}

.sidebar-mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.5);
  z-index: 90;
  opacity: 0;
  transition: opacity .2s;
}

.sidebar-mask.show { display: block; opacity: 1; }

.theme-btn {
  width: 36px; height: 36px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  display: grid; place-items: center;
  transition: background-color .15s, border-color .15s, transform .15s;
  flex-shrink: 0;
}

.theme-btn:hover { background: var(--chip-bg); border-color: var(--border-strong); }
.theme-btn:active { transform: scale(.95); }
.theme-btn svg { width: 16px; height: 16px; }

.theme-btn.sm { width: 32px; height: 32px; border-radius: 8px; }
.theme-btn.sm svg { width: 15px; height: 15px; }

@media (max-width: 800px) {
  .workspace { grid-template-columns: 1fr; }

  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 264px;
    z-index: 100;
    transform: translateX(-100%);
    box-shadow: 0 0 40px rgba(0,0,0,.2);
  }

  .sidebar.open { transform: translateX(0); }

  .menu-toggle { display: grid; }

  .home-main { padding: 24px 16px 60px; }
  .home-hero h1 { font-size: 22px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- =========================================================
     视图 1：首页（卡片铺满）
     ========================================================= -->
<div class="view view-home active" id="viewHome">
  <div class="home">
    <header class="home-header">
      <div class="home-brand">
        <div class="brand-logo">🧭</div>
        <div class="brand-text">
          <div class="brand-name">工具箱</div>
          <div class="brand-sub" id="brandSub">共 0 个工具</div>
        </div>
      </div>
      <button class="theme-btn" data-theme-toggle title="切换主题" aria-label="切换主题"></button>
    </header>

    <main class="home-main">
      <div class="home-hero">
        <h1>选择一个工具</h1>
        <p>点击卡片即可进入，右上角可在浅色/深色之间切换</p>
      </div>

      <div class="home-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="homeSearch" class="search-input" type="text" placeholder="搜索工具名称、标签、描述…" autocomplete="off" />
        <kbd class="search-kbd">/</kbd>
      </div>

      <div class="filters" id="filters"></div>
      <ul class="grid" id="grid"></ul>

      <div class="empty" id="empty" hidden>
        <div class="empty-icon">🔍</div>
        <div class="empty-title">没有找到匹配的工具</div>
        <div class="empty-sub">试试其它关键词，或清空搜索条件</div>
      </div>
    </main>

    <footer class="home-footer">
      静态索引 · 所有工具均在浏览器本地运行
    </footer>
  </div>
</div>

<!-- =========================================================
     视图 2：工作区（左侧菜单 + 右侧 iframe）
     ========================================================= -->
<div class="view view-workspace" id="viewWorkspace">
  <div class="workspace">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button class="back-btn" id="backHome">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          返回首页
        </button>
      </div>

      <div class="sidebar-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="sideSearch" class="search-input" type="text" placeholder="搜索工具…" autocomplete="off" />
      </div>

      <ul class="sidebar-nav" id="sidebarNav"></ul>

      <div class="sidebar-foot">
        <span class="ver">v1.0</span>
        <button class="theme-btn sm" data-theme-toggle title="切换主题" aria-label="切换主题"></button>
      </div>
    </aside>

    <div class="sidebar-mask" id="sidebarMask"></div>

    <main class="main">
      <div class="main-head">
        <button class="menu-toggle" id="menuToggle" title="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="main-title" id="mainTitle">请选择左侧工具</div>

        <div class="main-actions">
          <button class="action-btn" id="btnRefresh" title="刷新当前工具">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
              <path d="M21 3v6h-6"></path>
            </svg>
          </button>
          <button class="action-btn" id="btnNewTab" title="在新窗口打开">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <path d="M15 3h6v6"></path>
              <path d="M10 14L21 3"></path>
            </svg>
          </button>
          <button class="action-btn" id="btnFullscreen" title="全屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="main-body" id="mainBody">
        <div class="loading-mask" id="loadingMask" style="display:none">
          <div style="text-align:center">
            <div class="spinner"></div>
            <div>正在加载…</div>
          </div>
        </div>
        <iframe id="mainFrame" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    </main>
  </div>
</div>

<script>
/* =========================================================
 * ★ 工具列表配置区（唯一需要改的地方）
 *
 *   id        唯一标识，用于 URL hash，不能重复
 *   name      工具名称
 *   desc      卡片描述
 *   category  分类（自动生成筛选条，不用单独维护）
 *   icon      emoji 或图标字符
 *   tint      图标底色：blue / emerald / violet / amber / rose / cyan
 *   url       工具页面地址（推荐用 /tools/xxx.html 以网站根为起点的绝对路径）
 *   tags      标签数组，用于搜索和卡片展示
 * =======================================================*/
const TOOLS = [
  {
    id: 'barge-manifest',
    name: '驳船无纸化清单生成器',
    desc: '上传预配舱单，自动解析生成驳船无纸清单；支持在线补录空字段，一键导出 Excel。',
    category: '清单生成',
    icon: '📋',
    tint: 'blue',
    url: '/tools/barge-manifest.htm',
    tags: ['驳船', '无纸化', '清单', '预配舱单', 'VGM'],
  },
  {
    id: 'multimodal-list',
    name: '进出口多式联运清单生成器',
    desc: '上传预配舱单，自动生成出口多式联运清单，并保留进口清单空白模板。',
    category: '清单生成',
    icon: '🚢',
    tint: 'emerald',
    url: '/tools/multimodal-list.htm',
    tags: ['多式联运', '出口', '进口', '清单', '集装箱'],
  },
  {
    id: 'multimodal-declaration',
    name: '出口多式联运申请单生成器',
    desc: '上传预配舱单，自动拆解为基本信息、分单信息、集装箱、封志、提运单、轨迹、参数等 8 个子表。',
    category: '申报单据',
    icon: '🧾',
    tint: 'violet',
    url: '/tools/multimodal-declaration.htm',
    tags: ['报关', '申请单', '多式联运', '分单', '8 个子表'],
  },
];

/* =========================================================
 * 主题：默认跟随系统；手动切换仅本次会话有效
 * =======================================================*/
const media = window.matchMedia('(prefers-color-scheme: dark)');

const ICON_SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>`;
const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

let userOverride = false;

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
    btn.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
  });
}

function currentSystemTheme(){
  return media.matches ? 'dark' : 'light';
}

function initTheme(){
  userOverride = false;
  applyTheme(currentSystemTheme());
}

document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    userOverride = true;
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });
});

function onSystemThemeChange(e){
  if (!userOverride) applyTheme(e.matches ? 'dark' : 'light');
}
if (media.addEventListener) media.addEventListener('change', onSystemThemeChange);
else if (media.addListener) media.addListener(onSystemThemeChange);

/* =========================================================
 * 元素
 * =======================================================*/
const els = {
  viewHome:      document.getElementById('viewHome'),
  viewWorkspace: document.getElementById('viewWorkspace'),
  filters:       document.getElementById('filters'),
  grid:          document.getElementById('grid'),
  empty:         document.getElementById('empty'),
  homeSearch:    document.getElementById('homeSearch'),
  brandSub:      document.getElementById('brandSub'),
  sidebar:       document.getElementById('sidebar'),
  sidebarNav:    document.getElementById('sidebarNav'),
  sidebarMask:   document.getElementById('sidebarMask'),
  sideSearch:    document.getElementById('sideSearch'),
  backHome:      document.getElementById('backHome'),
  menuToggle:    document.getElementById('menuToggle'),
  mainTitle:     document.getElementById('mainTitle'),
  mainFrame:     document.getElementById('mainFrame'),
  loadingMask:   document.getElementById('loadingMask'),
  btnRefresh:    document.getElementById('btnRefresh'),
  btnNewTab:     document.getElementById('btnNewTab'),
  btnFullscreen: document.getElementById('btnFullscreen'),
};

let activeCategory = '全部';
let homeQuery = '';
let sideQuery = '';
let activeToolId = null;
let loadTimer = null;

function escapeAttr(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
const escapeHtml = escapeAttr;

/* =========================================================
 * 给工具页 URL 加 ?embedded=1
 * =======================================================*/
function appendEmbeddedFlag(url){
  if (!url) return url;
  if (url.indexOf('embedded=1') !== -1) return url;
  const sep = url.indexOf('?') !== -1 ? '&' : '?';
  return url + sep + 'embedded=1';
}

/* =========================================================
 * 路由
 * =======================================================*/
function currentHash(){
  return (location.hash || '').replace(/^#/, '');
}

function goHome(){
  history.replaceState(null, '', location.pathname + location.search);
  showHome();
}

function openTool(id){
  const tool = TOOLS.find(t => t.id === id);
  if (!tool){ goHome(); return; }
  if (currentHash() !== id){
    history.pushState(null, '', '#' + id);
  }
  showWorkspace(tool);
}

function showHome(){
  els.viewHome.classList.add('active');
  els.viewWorkspace.classList.remove('active');
  document.body.style.overflow = 'auto';
  els.mainFrame.src = 'about:blank';
  activeToolId = null;
  closeSidebarMobile();
}

function showWorkspace(tool){
  els.viewHome.classList.remove('active');
  els.viewWorkspace.classList.add('active');
  document.body.style.overflow = 'hidden';
  loadTool(tool);
}

window.addEventListener('popstate', () => {
  const hash = currentHash();
  if (!hash){
    showHome();
  } else {
    const tool = TOOLS.find(t => t.id === hash);
    if (tool) showWorkspace(tool);
    else showHome();
  }
});

/* =========================================================
 * 首页渲染
 * =======================================================*/
function matchQuery(tool, q){
  if (!q) return true;
  const hay = [tool.name, tool.desc, tool.category, ...(tool.tags || []), tool.id]
    .join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}

function getCategories(){
  const map = new Map();
  const visible = TOOLS.filter(t => matchQuery(t, homeQuery.trim()));
  map.set('全部', visible.length);
  visible.forEach(t => map.set(t.category, (map.get(t.category) || 0) + 1));
  return Array.from(map.entries());
}

function renderFilters(){
  els.filters.innerHTML = getCategories().map(([name, count]) => {
    const active = name === activeCategory ? ' active' : '';
    return `<div class="filter-chip${active}" data-cat="${escapeAttr(name)}">
      ${escapeHtml(name)}<span class="cnt">${count}</span>
    </div>`;
  }).join('');
}

function renderGrid(){
  const list = TOOLS.filter(t => {
    if (activeCategory !== '全部' && t.category !== activeCategory) return false;
    return matchQuery(t, homeQuery.trim());
  });

  if (!list.length){
    els.grid.innerHTML = '';
    els.empty.hidden = false;
    return;
  }

  els.empty.hidden = true;

  els.grid.innerHTML = list.map((t, i) => `
    <li class="card"
        data-tool-id="${escapeAttr(t.id)}"
        data-category="${escapeAttr(t.category)}"
        data-url="${escapeAttr(t.url)}"
        data-name="${escapeAttr(t.name)}"
        data-icon="${escapeAttr(t.icon || '')}"
        data-tint="${escapeAttr(t.tint || 'blue')}"
        data-tags="${escapeAttr((t.tags || []).join(','))}"
        style="animation-delay:${Math.min(i * 35, 260)}ms"
        role="button" tabindex="0">
      <div class="card-icon" data-tint="${escapeAttr(t.tint || 'blue')}">${escapeHtml(t.icon || '🔧')}</div>
      <div>
        <div class="card-title">${escapeHtml(t.name)}</div>
        <div class="card-desc">${escapeHtml(t.desc || '')}</div>
      </div>
      <div class="card-foot">
        <div class="card-tags">
          <span class="mini-tag">${escapeHtml(t.category)}</span>
          ${(t.tags || []).slice(0, 2).map(tag => `<span class="mini-tag">${escapeHtml(tag)}</span>`).join('')}
        </div>
        <span class="card-open">
          打开
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </span>
      </div>
    </li>
  `).join('');
}

els.filters.addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  activeCategory = chip.dataset.cat;
  renderFilters();
  renderGrid();
});

els.grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  openTool(card.dataset.toolId);
});

els.grid.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card');
  if (!card) return;
  e.preventDefault();
  openTool(card.dataset.toolId);
});

let homeSearchTimer;
els.homeSearch.addEventListener('input', () => {
  clearTimeout(homeSearchTimer);
  homeSearchTimer = setTimeout(() => {
    homeQuery = els.homeSearch.value;
    renderFilters();
    renderGrid();
  }, 80);
});

/* =========================================================
 * 侧边栏渲染
 * =======================================================*/
function renderSidebar(){
  const groups = {};
  TOOLS.forEach(t => {
    if (!matchQuery(t, sideQuery.trim())) return;
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });

  const total = Object.values(groups).reduce((s, arr) => s + arr.length, 0);

  if (!total){
    els.sidebarNav.innerHTML = `
      <li style="padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;list-style:none">
        <div style="font-size:28px;opacity:.5;margin-bottom:8px">🔍</div>
        没有找到匹配的工具
      </li>`;
    return;
  }

  els.sidebarNav.innerHTML = Object.entries(groups).map(([cat, list]) => `
    <li class="nav-group">
      <div class="group-title">
        ${escapeHtml(cat)}
        <span class="cnt">${list.length}</span>
      </div>
      <ul class="nav-list">
        ${list.map(t => `
          <li class="nav-item${t.id === activeToolId ? ' active' : ''}"
              data-tool-id="${escapeAttr(t.id)}"
              data-tint="${escapeAttr(t.tint || 'blue')}"
              title="${escapeAttr(t.name)}">
            <div class="nav-icon">${escapeHtml(t.icon || '🔧')}</div>
            <div class="nav-name">${escapeHtml(t.name)}</div>
          </li>
        `).join('')}
      </ul>
    </li>
  `).join('');
}

els.sidebarNav.addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  openTool(item.dataset.toolId);
});

let sideSearchTimer;
els.sideSearch.addEventListener('input', () => {
  clearTimeout(sideSearchTimer);
  sideSearchTimer = setTimeout(() => {
    sideQuery = els.sideSearch.value;
    renderSidebar();
  }, 80);
});

/* =========================================================
 * 工作区：加载工具
 * =======================================================*/
function loadTool(tool){
  activeToolId = tool.id;
  renderSidebar();
  els.mainTitle.textContent = tool.name;

  els.btnNewTab.dataset.url = tool.url;

  els.mainFrame.dataset.url = appendEmbeddedFlag(tool.url);
  showLoading();
  els.mainFrame.src = els.mainFrame.dataset.url;

  closeSidebarMobile();
}

function showLoading(){
  els.loadingMask.style.display = 'grid';
  els.loadingMask.classList.remove('hide');
  els.loadingMask.innerHTML = `
    <div style="text-align:center">
      <div class="spinner"></div>
      <div>正在加载…</div>
    </div>`;

  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => {
    if (els.loadingMask.classList.contains('hide')) return;
    els.loadingMask.innerHTML = `
      <div class="error-box">
        <div class="icon">⚠️</div>
        <div class="title">文件加载失败</div>
        <div class="desc">
          浏览器无法找到下面这个文件：<br>
          <code>${escapeHtml(els.mainFrame.dataset.url || '')}</code><br>
          请确认：<br>
          1）文件确实已上传到服务器对应目录；<br>
          2）路径大小写与服务端一致（Linux 区分大小写）；<br>
          3）扩展名是 <b>.html</b> 还是 <b>.htm</b>。
        </div>
      </div>`;
  }, 3500);
}

function hideLoading(){
  clearTimeout(loadTimer);
  els.loadingMask.classList.add('hide');
  setTimeout(() => { els.loadingMask.style.display = 'none'; }, 250);
}

els.mainFrame.addEventListener('load', () => {
  const src = els.mainFrame.src;
  if (!src || src === 'about:blank') return;
  hideLoading();
});

/* =========================================================
 * 工作区：侧边栏 & 操作按钮
 * =======================================================*/
function openSidebarMobile(){
  els.sidebar.classList.add('open');
  els.sidebarMask.classList.add('show');
}
function closeSidebarMobile(){
  els.sidebar.classList.remove('open');
  els.sidebarMask.classList.remove('show');
}

els.menuToggle.addEventListener('click', () => {
  if (els.sidebar.classList.contains('open')) closeSidebarMobile();
  else openSidebarMobile();
});
els.sidebarMask.addEventListener('click', closeSidebarMobile);

els.backHome.addEventListener('click', goHome);

els.btnRefresh.addEventListener('click', () => {
  if (!els.mainFrame.dataset.url) return;
  showLoading();
  els.mainFrame.src = 'about:blank';
  setTimeout(() => {
    els.mainFrame.src = els.mainFrame.dataset.url;
  }, 60);
});

els.btnNewTab.addEventListener('click', () => {
  const url = els.btnNewTab.dataset.url;
  if (url) window.open(url, '_blank', 'noopener');
});

els.btnFullscreen.addEventListener('click', () => {
  const body = document.getElementById('mainBody');
  if (document.fullscreenElement){
    document.exitFullscreen().catch(() => {});
  } else if (body.requestFullscreen){
    body.requestFullscreen().catch(() => {});
  }
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)){
    e.preventDefault();
    const target = els.viewHome.classList.contains('active') ? els.homeSearch : els.sideSearch;
    target.focus();
    target.select();
    return;
  }

  if (e.key === 'Escape' && document.activeElement === els.homeSearch){
    if (els.homeSearch.value){
      els.homeSearch.value = '';
      homeQuery = '';
      renderFilters();
      renderGrid();
    } else {
      els.homeSearch.blur();
    }
  }
});

/* =========================================================
 * 启动
 * =======================================================*/
function init(){
  initTheme();
  els.brandSub.textContent = `共 ${TOOLS.length} 个工具`;
  renderFilters();
  renderGrid();
  renderSidebar();

  const hash = currentHash();
  if (hash){
    const tool = TOOLS.find(t => t.id === hash);
    if (tool){
      showWorkspace(tool);
      return;
    }
  }
  showHome();
}

init();
</script>
</body>
</html>
